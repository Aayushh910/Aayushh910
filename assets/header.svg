<svg width="880" height="330" viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SF Mono','Fira Code','Consolas',monospace; }
      .bar { fill: #2b2b2b; }
      .win { fill: #0d1117; }
      .titletxt { fill: #9a9a9a; font-size: 13px; }
      .prompt { fill: #27c93f; font-size: 14px; }
      .cmd { fill: #58a6ff; font-size: 14px; }
      .key { fill: #7ee787; font-size: 14px; }
      .str { fill: #ffbd2e; font-size: 14px; }
      .cmt { fill: #6e7681; font-size: 14px; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="330" rx="12" class="win" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="880" height="34" rx="12" class="bar"/>
  <rect x="0" y="22" width="880" height="12" class="bar"/>

  <circle cx="24" cy="17" r="6.5" fill="#FF5F56"/>
  <circle cx="46" cy="17" r="6.5" fill="#FFBD2E"/>
  <circle cx="68" cy="17" r="6.5" fill="#27C93F"/>

  <text x="440" y="21" text-anchor="middle" class="mono titletxt">aayush@MacBook-Pro: ~</text>

  <text x="24" y="62" class="mono prompt">aayush@MacBook-Pro ~ % <tspan class="cmd">cat</tspan> <tspan class="str">profile.md</tspan></text>

  <text x="24" y="98"  class="mono"><tspan class="key">name</tspan>      = <tspan class="str">"Aayush Savaliya"</tspan></text>
  <text x="24" y="122" class="mono"><tspan class="key">role</tspan>      = <tspan class="str">"AI/ML Engineer (Aspiring)"</tspan></text>
  <text x="24" y="146" class="mono"><tspan class="key">university</tspan>= <tspan class="str">"CHARUSAT University"</tspan></text>
  <text x="24" y="170" class="mono"><tspan class="key">branch</tspan>    = <tspan class="str">"B.Tech AIML"</tspan></text>
  <text x="24" y="194" class="mono"><tspan class="key">cgpa</tspan>      = <tspan class="str">"8.17 / 10 (No Backlogs)"</tspan></text>
  <text x="24" y="218" class="mono"><tspan class="key">location</tspan>  = <tspan class="str">"India 🇮🇳"</tspan></text>
  <text x="24" y="242" class="mono"><tspan class="key">status</tspan>    = <tspan class="str">"Building the future 🚀"</tspan></text>

  <text x="24" y="278" class="mono prompt">aayush@MacBook-Pro ~ % <tspan class="cmt">▍</tspan></text>
</svg>
